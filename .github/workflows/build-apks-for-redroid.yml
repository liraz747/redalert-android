name: Build APKs For Redroid

on:
  workflow_dispatch:
  push:
    branches:
      - codex/**

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build current branch debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build upstream master debug APK
        run: |
          git remote add upstream https://github.com/eladnava/redalert-android.git || true
          git fetch --no-tags upstream master
          mkdir -p .ci
          git worktree add .ci/upstream-master FETCH_HEAD
          cd .ci/upstream-master
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK artifacts
        run: |
          mkdir -p .ci/apks
          cp app/build/outputs/apk/debug/app-debug.apk .ci/apks/pr-app-debug.apk
          cp .ci/upstream-master/app/build/outputs/apk/debug/app-debug.apk .ci/apks/upstream-master-app-debug.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redroid-apks
          path: .ci/apks
          if-no-files-found: error
