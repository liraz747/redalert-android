name: Cloud Android Validation

on:
  workflow_dispatch:
  push:
    branches:
      - material3-redesign
      - codex/**

jobs:
  build-and-emulator-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x .github/scripts/cloud_emulator_validation.sh
          chmod +x .github/scripts/uiauto_helper.py

      - name: Build current branch debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Fetch upstream master and build debug APK
        run: |
          git remote add upstream https://github.com/eladnava/redalert-android.git || true
          git fetch --no-tags upstream master
          mkdir -p .ci
          git worktree add .ci/upstream-master FETCH_HEAD
          cd .ci/upstream-master
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run cloud emulator migration and regression validation (attempt 1)
        id: emulator_validation_1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb kill-server
            adb start-server
            adb wait-for-device
            adb reconnect offline || true
            adb wait-for-device
            adb devices
            bash .github/scripts/cloud_emulator_validation.sh

      - name: Run cloud emulator migration and regression validation (retry)
        id: emulator_validation_2
        if: steps.emulator_validation_1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -wipe-data
          script: |
            adb kill-server
            adb start-server
            adb wait-for-device
            adb reconnect offline || true
            adb wait-for-device
            adb devices
            bash .github/scripts/cloud_emulator_validation.sh

      - name: Fail if emulator validation did not pass
        if: steps.emulator_validation_1.outcome == 'failure' && steps.emulator_validation_2.outcome == 'failure'
        run: |
          echo "Both emulator validation attempts failed."
          exit 1

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-android-validation-artifacts
          path: .ci/results
          if-no-files-found: warn
